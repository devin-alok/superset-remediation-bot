services:
  webhook:
    build: .
    image: superset-remediation-bot
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
    entrypoint: ["uvicorn"]
    command: ["automation.webhook:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 3s
      retries: 3
