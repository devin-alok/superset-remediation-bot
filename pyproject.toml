[project]
name = "superset-remediation-bot"
version = "0.2.0"
description = "Remediate a GitHub issue with a Devin session"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.3"]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "ruff>=0.6.4", "mypy>=1.11.2", "types-requests>=2.32.0"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
