[project]
name = "superset-remediation-bot"
version = "0.1.0"
description = "Event-driven remediation of Apache Superset issues using the Devin API"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.3",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2", "ruff>=0.6.4", "mypy>=1.11.2", "types-requests>=2.32.0"]

[project.scripts]
remediate = "automation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["automation"]

[tool.setuptools.package-data]
automation = ["fixtures/*.json"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
