name: Remediate labelled issue

# The trigger. Labelling is the human approval gate: filing an issue is free,
# labelling it spends ACUs.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to remediate
        required: true

permissions:
  contents: read
  issues: write

jobs:
  remediate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'devin:remediate'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore previous state
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: runs
          key: remediation-state-${{ github.run_id }}
          restore-keys: remediation-state-

      - name: Build image
        run: docker build -t remediation-bot .

      - name: Remediate
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e DEVIN_API_KEY -e GITHUB_TOKEN \
            -e GITHUB_REPO=${{ github.repository }} \
            -v "$PWD/runs:/app/runs" \
            remediation-bot run --issue ${{ github.event.inputs.issue || github.event.issue.number }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: remediation-report-${{ github.run_id }}
          path: runs/
